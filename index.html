<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAITM Fest 2027 - Cultural & Sports Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>Annual Cultural & Sports Fest 2027</h1>
    <p>Dinabandhu Andrews Institute of Technology & Management</p>
    <div id="countdown" class="countdown">Loading timer...</div>
  </header>

  <main class="container">
    <!-- Category Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn active" data-category="all">All Events</button>
      <button class="tab-btn" data-category="sports">Sports</button>
      <button class="tab-btn" data-category="dance">Cultural Dance</button>
      <button class="tab-btn" data-category="music">Music & Singing</button>
    </div>

    <!-- Dynamic Event Cards Container -->
    <section id="events-grid" class="events-grid"></section>
  </main>

  <!-- Registration Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal" class="close-btn">&times;</span>
      <h2 id="modal-event-title">Register for Event</h2>
      <form id="reg-form">
        <input type="text" id="student-name" placeholder="Full Name" required />
        <input type="text" id="student-dept" placeholder="Department (e.g., BCA)" required />
        <input type="tel" id="student-phone" placeholder="10-digit Phone Number" required />
        <button type="submit" class="submit-btn">Confirm Registration</button>
      </form>
      <p id="form-message" class="message"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
